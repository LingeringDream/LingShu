name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lingshu_test
          POSTGRES_USER: lingshu
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        # Pin to the 0.8.x line: it matches the `sqlx = "0.8"` dependency and stays
        # compatible with the repo's pinned rustc (1.88). sqlx-cli 0.9+ requires rustc 1.94+.
        run: cargo install sqlx-cli --version '^0.8' --locked --no-default-features --features postgres
      - name: Run migrations
        run: sqlx migrate run --source crates/lingshu-server/migrations
        env:
          DATABASE_URL: postgres://lingshu:test_password@localhost:5432/lingshu_test
      - name: Run tests
        run: cargo test --all
        env:
          DATABASE_URL: postgres://lingshu:test_password@localhost:5432/lingshu_test
          REDIS_URL: redis://localhost:6379

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  windows-desktop:
    name: Windows Desktop Package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm run test
        working-directory: frontend
      - name: Build Windows sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -Target x86_64-pc-windows-msvc
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
        working-directory: frontend
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingshu-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  openapi-contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Generate OpenAPI spec
        run: cargo test -p lingshu-server openapi_spec_matches_committed_file
