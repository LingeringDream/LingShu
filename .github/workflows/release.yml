name: Release

# Trigger on version tags, e.g. v0.1.0
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    permissions:
      contents: write # needed to create/upload release assets
    steps:
      - uses: actions/checkout@v5

      # ── Rust ──────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: aarch64-apple-darwin

      # ── Node ──────────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── Build server sidecar ──────────────────────────────────
      - name: Build backend (release)
        run: cargo build -p lingshu-server --release

      - name: Place sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          cp target/release/lingshu-server src-tauri/binaries/lingshu-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/lingshu-server-aarch64-apple-darwin

      # ── Build Tauri .app + .dmg ───────────────────────────────
      - name: Build Tauri app
        run: npm run tauri build
        working-directory: frontend
        env:
          # CI runners have no "LingShu Dev" cert in their keychain, so the
          # tauri.conf signingIdentity makes codesign fail ("item could not be
          # found in the keychain"). APPLE_SIGNING_IDENTITY takes precedence over
          # tauri.conf, so "-" makes tauri build ad-hoc sign the bundle (incl.
          # the lingshu-server sidecar) with no cert. Local builds leave this
          # unset → keep "LingShu Dev" (stable signature so the macOS
          # Accessibility grant survives rebuilds).
          APPLE_SIGNING_IDENTITY: "-"

      # ── Re-sign ad-hoc, --deep, to ensure every nested binary is covered ──
      - name: Codesign app
        run: |
          codesign --force --deep --sign - \
            "src-tauri/target/release/bundle/macos/灵枢 LingShu.app"

      # ── Create GitHub Release ─────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "灵枢 LingShu ${{ github.ref_name }}"
          body: |
            macOS and Windows desktop packages.

            **macOS install:**
            1. Open DMG → drag to Applications
            2. First launch: right-click → Open, or run:
               `xattr -cr /Applications/灵枢\ LingShu.app`

            **Runtime dependencies:** Docker Desktop + Ollama running locally

            **Supported packages:** macOS 14+ (Apple Silicon), Windows 10/11 (x64)
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: build-macos
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Windows sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -Target x86_64-pc-windows-msvc

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis
        working-directory: frontend

      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
