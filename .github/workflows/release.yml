name: Release

# Trigger on version tags, e.g. v0.1.0
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create draft if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_flags=()
            case "$GITHUB_REF_NAME" in *alpha*|*beta*|*rc*) release_flags+=(--prerelease);; esac
            notes_file="docs/releases/$GITHUB_REF_NAME.md"
            if [ -f "$notes_file" ]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --draft "${release_flags[@]}" --title "灵枢 LingShu $GITHUB_REF_NAME" --notes-file "$notes_file"
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --draft "${release_flags[@]}" --title "灵枢 LingShu $GITHUB_REF_NAME" --notes "CLI bundles include the memory service, PostgreSQL, MCP and a web console. Desktop installers are uploaded separately."
            fi
          fi

  build-cli:
    name: CLI (${{ matrix.target }})
    needs: prepare-release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - name: CLI unit tests
        run: cargo test --locked -p lingshu-cli
      - name: Build self-contained bundle
        run: python scripts/package-cli.py --target ${{ matrix.target }}
      - name: Install, MCP, upgrade and uninstall regression
        shell: bash
        run: python scripts/test-cli-install.py --archive "$(find dist/cli -name '*.tar.gz' -o -name '*.zip' | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/*
          if-no-files-found: error

  publish-cli:
    name: Publish verified CLI bundles
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist/cli
      - name: Upload CLI assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/cli/* scripts/install.sh scripts/install.ps1 --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  build-macos:
    name: Build macOS App
    needs: prepare-release
    runs-on: macos-latest
    permissions:
      contents: write # needed to create/upload release assets
    steps:
      - uses: actions/checkout@v5

      # ── Rust ──────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: aarch64-apple-darwin

      # ── Node ──────────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build self-contained backend and MCP sidecars
        run: ./scripts/build-sidecar.sh aarch64-apple-darwin

      # ── Build Tauri .app + .dmg ───────────────────────────────
      - name: Build Tauri app
        run: npm run tauri build
        working-directory: frontend
        env:
          # CI runners have no "LingShu Dev" cert in their keychain, so the
          # tauri.conf signingIdentity makes codesign fail ("item could not be
          # found in the keychain"). APPLE_SIGNING_IDENTITY takes precedence over
          # tauri.conf, so "-" makes tauri build ad-hoc sign the bundle (incl.
          # the lingshu-server sidecar) with no cert. Local builds leave this
          # unset → keep "LingShu Dev" (stable signature so the macOS
          # Accessibility grant survives rebuilds).
          APPLE_SIGNING_IDENTITY: "-"

      # ── Re-sign ad-hoc, --deep, to ensure every nested binary is covered ──
      - name: Codesign app
        run: |
          codesign --force --deep --sign - \
            "src-tauri/target/release/bundle/macos/灵枢 LingShu.app"

      - name: Upload macOS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/dmg/*.dmg --clobber

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: build-macos
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Windows sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -Target x86_64-pc-windows-msvc

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis
        working-directory: frontend

      - name: Upload Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName --clobber
