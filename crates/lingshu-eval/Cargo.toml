[package]
name = "lingshu-eval"
version = "1.6.0"
edition = "2021"
publish = false
description = "Offline competition evaluation harness for LingShu evolutionary memory"

[[bin]]
name = "lingshu-eval"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
