[package]
name = "lingshu-server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
build = "build.rs"

[features]
default = []
# Packages a PostgreSQL runtime inside the Windows desktop sidecar. The
# archive is downloaded while building and embedded into lingshu-server.exe;
# end users never need to install or download a database.
desktop-embedded-db = ["dep:postgresql_embedded", "dep:postgresql_archive"]

[[bin]]
name = "lingshu-server"
path = "src/main.rs"

[dependencies]
# Workspace deps
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
sqlx = { workspace = true }
fred = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
figment = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
prometheus-client = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
scraper = { workspace = true }
pdf-extract = { workspace = true }

postgresql_embedded = { version = "0.19.0", default-features = false, features = ["tokio", "rustls", "zonky"], optional = true }
postgresql_archive = { version = "0.19.0", default-features = false, features = ["github", "rustls", "zonky"], optional = true }

dotenvy = "0.15"
# getppid() for the "exit when the Tauri parent dies" sidecar watchdog (unix
# only; the call site is #[cfg(unix)]-gated).
libc = "0.2"

# Internal crates
lingshu-vector = { path = "../lingshu-vector" }
lingshu-mcp-core = { path = "../lingshu-mcp-core" }

[build-dependencies]
postgresql_archive = { version = "0.19.0", default-features = false, features = ["blocking", "github", "rustls", "zonky"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tower = { workspace = true, features = ["util"] }
