<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵枢 — 桌面宠物</title>


    <style>
      /* Pet window: frameless, transparent background handled by Tauri */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Dragging is handled programmatically via
         getCurrentWindow().startDragging() in PetWindow.tsx. We deliberately do
         NOT use -webkit-app-region here: an app-region drag layer swallows the
         click / double-click the pet relies on, and on macOS it conflicts with
         the JS-driven window drag. */
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>

    <link rel="modulepreload" crossorigin href="/team/assets/calendarReminderEvents-BBP1MF4N.js">
  </head>
